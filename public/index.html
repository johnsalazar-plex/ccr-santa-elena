<script>
    // Las credenciales ya NO viven en la página: las valida el servidor.
    let sessionToken = null;
    let currentRole = '';

    let connectedUsersList = new Map(); // usuario -> rol
    let currentUser = null;
    let socket = null;

    let masterOn = { 1: false, 2: false, 3: false };
    let stateGroup = { 1: 0, 2: 0, 3: 0 };
    let isTransitioning = { 1: false, 2: false, 3: false };
    let isShuttingDown = { 1: false, 2: false, 3: false };

    let beaconActive = false;
    let faultGroup = { 1: false, 2: false, 3: false };
    let auditLogs = [];

    // Estado del enlace
    let wsRetry = 0;
    let reconnectTimer = null;
    let serverOnline = false;
    let deviceOnline = false;

    window.addEventListener('DOMContentLoaded', () => {
      initWebSocket();
    });

    // Al volver a la pestaña (o al despertar el celular) reconecta de inmediato
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) initWebSocket();
    });

    function renderLinkStatus() {
      let b = document.getElementById('linkBadge');
      if (!b) {
        b = document.createElement('div');
        b.id = 'linkBadge';
        b.style.cssText = 'position:fixed;right:12px;bottom:12px;padding:6px 10px;border-radius:8px;font:12px sans-serif;color:#fff;z-index:9999;';
        document.body.appendChild(b);
      }
      if (!serverOnline) { b.style.background = '#dc2626'; b.textContent = 'Servidor: reconectando…'; }
      else if (!deviceOnline) { b.style.background = '#f59e0b'; b.textContent = 'Servidor OK · ESP32 desconectado'; }
      else { b.style.background = '#16a34a'; b.textContent = 'Servidor OK · ESP32 en línea'; }
    }

    function initWebSocket() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
      clearTimeout(reconnectTimer);

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

      socket.onopen = () => {
        console.log("Conectado al Servidor Central CCR");
        wsRetry = 0;
        serverOnline = true;
        renderLinkStatus();
        // Tras una reconexión retoma la sesión con el token (sin reenviar la contraseña)
        if (sessionToken) socket.send(JSON.stringify({ type: 'RESUME', token: sessionToken }));
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.type === 'SYNC_FULL_STATE' && data.data) {
            // Al (re)conectar, alinea el tablero con el estado real del servidor
            for (let g = 1; g <= 3; g++) {
              const s = data.data[g];
              if (!s || isTransitioning[g] || isShuttingDown[g]) continue;
              const waiting = masterOn[g] && stateGroup[g] === 0; // master encendido esperando un paso
              stateGroup[g] = s.state;
              masterOn[g] = s.state > 0 || waiting;
            }
            if (data.data[4]) beaconActive = !!data.data[4].beacon;
            updatePanelVisuals();
          }
          else if (data.type === 'CONTROL_AGL') {
            if (data.group >= 1 && data.group <= 3) {
              // No pisar una rampa que este mismo tablero está ejecutando
              if (!isTransitioning[data.group] && !isShuttingDown[data.group]) {
                stateGroup[data.group] = data.state;
                masterOn[data.group] = data.state > 0;
              }
            } else if (data.group === 4) {
              beaconActive = (data.state === 1);
            }
            updatePanelVisuals();
          }
          else if (data.type === 'SYNC_USERS') {
            connectedUsersList = new Map(data.users.map(x => [x.user, x.role]));
            renderConnectedUsers();
          }
          else if (data.type === 'LOGIN_OK') {
            onLoginOk(data);
          }
          else if (data.type === 'LOGIN_FAIL') {
            showLoginError(data.reason || 'Usuario o contraseña incorrectos');
          }
          else if (data.type === 'RESUME_FAIL') {
            if (currentUser) { alert('Tu sesión expiró. Inicia sesión de nuevo.'); logout(); }
          }
          else if (data.type === 'PASSWORD_CHANGED') {
            addAuditLog(`Gerente cambió la contraseña del usuario ${data.user}`, 'INFO');
            alert(`Contraseña de ${data.user} actualizada.` + (data.persistent ? '' : '\nAviso: se perderá si el servidor se reinicia (falta disco persistente).'));
          }
          else if (data.type === 'ERROR') {
            alert(data.message || 'Error');
          }
          else if (data.type === 'DEVICE_STATUS') {
            deviceOnline = !!data.online;
            renderLinkStatus();
          }
          else if (data.type === 'KICK_USER') {
            if (data.user === currentUser) {
              alert("Tu sesión ha sido finalizada por el Gerente.");
              logout();
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      socket.onclose = () => {
        serverOnline = false;
        deviceOnline = false;
        renderLinkStatus();
        const delay = Math.min(1000 * Math.pow(1.5, wsRetry++), 8000);
        reconnectTimer = setTimeout(initWebSocket, delay);
      };

      socket.onerror = () => { try { socket.close(); } catch (e) {} };
    }

    // Devuelve true si el comando salió; false si no hay conexión
    function sendWebSocketCommand(group, state) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'CONTROL_AGL',
          user: currentUser,
          group: group,
          state: state
        }));
        return true;
      }
      return false;
    }

    function showLoginError(msg) {
      const e = document.getElementById('errorText');
      e.textContent = msg;
      e.style.display = 'block';
    }

    // El servidor valida usuario y contraseña; la página ya no conoce ninguna clave
    function login() {
      const u = document.getElementById('userInput').value.trim();
      const p = document.getElementById('passInput').value.trim();
      if (!u || !p) { showLoginError('Ingresa usuario y contraseña'); return; }
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showLoginError('Sin conexión con el servidor. Espera unos segundos e intenta de nuevo.');
        return;
      }
      socket.send(JSON.stringify({ type: 'LOGIN', user: u, pass: p }));
      document.getElementById('passInput').value = '';
    }

    function onLoginOk(data) {
      sessionToken = data.token;
      currentRole = data.role;
      if (currentUser === data.user) return; // reconexión: ya estaba dentro

      currentUser = data.user;
      document.getElementById('errorText').style.display = 'none';
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('mimicPanel').style.display = 'block';
      document.getElementById('currentUserDisplay').innerText = `${data.user} (${data.role})`;

      const isManager = (data.user === 'gerente');
      document.querySelectorAll('.manager-only').forEach(el => el.style.display = isManager ? 'block' : 'none');
      document.getElementById('btnExportPDF').style.display = isManager ? 'inline-block' : 'none';

      addAuditLog(`Inicio de sesión de ${data.user}`, 'INFO');
      updatePanelVisuals();
    }

    function logout() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'LOGOUT' }));
      }
      sessionToken = null;
      currentRole = '';
      connectedUsersList.clear();
      currentUser = null;
      document.getElementById('mimicPanel').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }

    function renderConnectedUsers() {
      const tbody = document.getElementById('connectedUsersBody');
      if (!tbody) return;

      tbody.innerHTML = Array.from(connectedUsersList, ([u, role]) => {
        const kickBtn = (u !== 'gerente')
          ? `<button class="btn-danger btn-sm" data-user="${u}" onclick="kickUser(this.dataset.user)">Desconectar</button>`
          : `<span style="color:#94a3b8;">--</span>`;
        return `<tr><td><strong>${u}</strong></td><td>${role}</td><td>${kickBtn}</td></tr>`;
      }).join('');
    }

    function kickUser(u) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'KICK_USER', user: u }));
        addAuditLog(`Gerente expulsó al usuario ${u}`, 'ALARM');
      }
    }

    // El cambio se hace en el servidor (antes solo cambiaba en memoria del navegador y se perdía al recargar)
    function changeUserPassword() {
      const u = document.getElementById('selUserChange').value;
      const newPass = document.getElementById('newPasswordInput').value.trim();
      if (newPass.length < 8) { alert('La contraseña debe tener al menos 8 caracteres'); return; }
      if (!socket || socket.readyState !== WebSocket.OPEN) { alert('Sin conexión con el servidor'); return; }
      socket.send(JSON.stringify({ type: 'CHANGE_PASSWORD', user: u, newPass }));
      document.getElementById('newPasswordInput').value = '';
    }

    // GENERACIÓN DE REPORTE PDF DE AUDITORÍA Y ESTADO CCR
    function generatePDFReport() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.setTextColor(15, 23, 42);
      doc.text("AEROPUERTO SANTA ELENA - CCR & AGL REPORT", 14, 20);
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text(`Reporte generado por: ${currentUser} (${currentRole})`, 14, 28);
      doc.text(`Fecha y hora de generación: ${new Date().toLocaleString()}`, 14, 34);

      doc.setFontSize(12);
      doc.setTextColor(15, 23, 42);
      doc.text("Estado Actual de los Circuitos CCR", 14, 44);

      const statusData = [
        ["Circuito Pista", masterOn[1] ? "ACTIVADO" : "DESACTIVADO", stateGroup[1] > 0 ? `PASO ${stateGroup[1]}` : "OFF", faultGroup[1] ? "FALLA SIMULADA" : "NORMAL"],
        ["Circuito Taxeo", masterOn[2] ? "ACTIVADO" : "DESACTIVADO", stateGroup[2] > 0 ? `PASO ${stateGroup[2]}` : "OFF", faultGroup[2] ? "FALLA SIMULADA" : "NORMAL"],
        ["Circuito PAPI", masterOn[3] ? "ACTIVADO" : "DESACTIVADO", stateGroup[3] > 0 ? `PASO ${stateGroup[3]}` : "OFF", faultGroup[3] ? "FALLA SIMULADA" : "NORMAL"],
        ["Faro Aeródromo", beaconActive ? "ENCENDIDO" : "APAGADO", "-", "-"]
      ];

      doc.autoTable({
        startY: 48,
        head: [['Circuito', 'Master', 'Intensidad / Paso', 'Estado de Operación']],
        body: statusData,
        theme: 'grid',
        headStyles: { fillStyle: 'f', fillColor: [37, 99, 235] }
      });

      const logY = doc.lastAutoTable.finalY + 12;
      doc.setFontSize(12);
      doc.text("Registro Histórico de Auditoría de Operaciones", 14, logY);

      const tableLogs = auditLogs.map(l => [l.timestamp, l.user, l.action, l.level]);

      doc.autoTable({
        startY: logY + 4,
        head: [['Timestamp', 'Usuario', 'Acción Realizada', 'Nivel']],
        body: tableLogs.length > 0 ? tableLogs : [['--', '--', 'Sin eventos registrados', 'INFO']],
        theme: 'striped',
        headStyles: { fillColor: [15, 23, 42] }
      });

      doc.save(`Reporte_CCR_SantaElena_${new Date().toISOString().slice(0,10)}.pdf`);
      addAuditLog("Generó reporte PDF de bitácora y auditoría", "INFO");
    }

    // APAGADO GRADUAL (5 -> 4 -> 3 -> 2 -> 1 -> OFF, 2 s POR PASO)
    async function toggleIndividualMaster(group) {
      if (isTransitioning[group] || isShuttingDown[group]) return;

      const sw = document.getElementById(`master-g${group}`);

      if (!masterOn[group]) {
        masterOn[group] = true;
        sw.classList.add('active');
        addAuditLog(`MASTER Grupo ${group} ACTIVADO`, 'INFO');
        updatePanelVisuals();
      } else {
        masterOn[group] = false;
        sw.classList.remove('active');
        addAuditLog(`MASTER Grupo ${group} DESACTIVADO - Bajando gradualmente a OFF`, 'INFO');

        if (stateGroup[group] > 0) {
          isShuttingDown[group] = true;

          while (stateGroup[group] > 0) {
            stateGroup[group]--;

            // Si no hay conexión, cancela: la UI no debe mostrar un paso que el ESP32 nunca recibió
            if (!sendWebSocketCommand(group, stateGroup[group])) {
              stateGroup[group]++;
              masterOn[group] = true;
              sw.classList.add('active');
              addAuditLog(`Sin conexión: apagado del Grupo ${group} cancelado`, 'ALARM');
              break;
            }

            updatePanelVisuals();
            addAuditLog(`Desacelerando Grupo ${group} -> PASO ${stateGroup[group]}`, 'INFO');

            if (stateGroup[group] > 0) {
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }

          isShuttingDown[group] = false;
        }

        updatePanelVisuals();
      }
    }

    // CAMBIO DE PASOS MEDIANTE PADS (2 SEGUNDOS POR PASO)
    async function selectPad(group, targetStep) {
      if (!masterOn[group] || isTransitioning[group] || isShuttingDown[group]) return;

      const currentStep = stateGroup[group];
      if (targetStep === currentStep) return;

      isTransitioning[group] = true;
      const direction = targetStep > currentStep ? 1 : -1;
      let step = currentStep;

      while (step !== targetStep) {
        if (!masterOn[group]) break;

        step += direction;

        if (!sendWebSocketCommand(group, step)) {
          addAuditLog(`Sin conexión: secuencia del Grupo ${group} cancelada en PASO ${stateGroup[group]}`, 'ALARM');
          break;
        }

        stateGroup[group] = step;
        updatePanelVisuals();
        addAuditLog(`Grupo ${group} -> PASO ${step}`, 'INFO');

        await new Promise(resolve => setTimeout(resolve, 2000));
      }

      isTransitioning[group] = false;
      updatePanelVisuals();
    }

    function toggleBeacon() {
      const next = !beaconActive;
      if (!sendWebSocketCommand(4, next ? 1 : 0)) {
        addAuditLog('Sin conexión: comando del faro NO enviado', 'ALARM');
        return;
      }
      beaconActive = next;
      addAuditLog(`Faro de Aeródromo ${beaconActive ? 'ON' : 'OFF'}`, 'INFO');
      updatePanelVisuals();
    }

    function toggleFault(group) {
      faultGroup[group] = !faultGroup[group];
      addAuditLog(`Simulación de Falla en grupo ${group}`, 'ALARM');
      updatePanelVisuals();
    }

    function clearAllFaults() {
      faultGroup[1] = faultGroup[2] = faultGroup[3] = false;
      addAuditLog("Fallas restablecidas", "INFO");
      updatePanelVisuals();
    }

    function addAuditLog(action, level = 'INFO') {
      auditLogs.unshift({ timestamp: new Date().toLocaleTimeString(), user: currentUser || 'SISTEMA', action, level });
      if (auditLogs.length > 200) auditLogs.length = 200;
      const tbody = document.getElementById('logTableBody');
      tbody.innerHTML = auditLogs.slice(0, 60).map(l => `<tr><td>${l.timestamp}</td><td><strong>${l.user}</strong></td><td>${l.action}</td><td class="level-${l.level}">${l.level}</td></tr>`).join('');
    }

    function updatePanelVisuals() {
      const tagIds = { 1: 'tag-g1', 2: 'tag-g2', 3: 'tag-papi' };

      [1, 2, 3].forEach(g => {
        const tag = document.getElementById(tagIds[g]);

        const sw = document.getElementById(`master-g${g}`);
        if (sw) sw.classList.toggle('active', masterOn[g]);

        for (let p = 1; p <= 5; p++) {
          const padBtn = document.getElementById(`pad-${g}-${p}`);
          if (padBtn) {
            padBtn.disabled = !masterOn[g] || isTransitioning[g] || isShuttingDown[g];
            if (masterOn[g] && stateGroup[g] === p) {
              padBtn.classList.add('active');
            } else {
              padBtn.classList.remove('active');
            }
          }
        }

        if (isShuttingDown[g]) {
          tag.innerText = `APAGANDO... (PASO ${stateGroup[g]})`;
          tag.className = "intensity-tag transitioning-tag";
        } else if (!masterOn[g]) {
          tag.innerText = "MASTER OFF";
          tag.className = "intensity-tag";
        } else {
          if (faultGroup[g]) {
            tag.innerText = "¡ALARMA FALLA!";
            tag.className = "intensity-tag";
          } else if (isTransitioning[g]) {
            tag.innerText = `CAMBIANDO... (PASO ${stateGroup[g]})`;
            tag.className = "intensity-tag transitioning-tag";
          } else {
            tag.innerText = stateGroup[g] === 0 ? "ESTADO: EN ESPERA" : `PASO ${stateGroup[g]}`;
            tag.className = "intensity-tag";
          }
        }
      });

      updateSvgMap();

      document.getElementById('beaconBtn').className = `switch-btn ${beaconActive ? 'active' : ''}`;
      document.getElementById('tag-beacon').innerText = beaconActive ? "ESTADO: ENCENDIDO" : "ESTADO: APAGADO";
    }

    function updateSvgMap() {
      const isActivePista = (masterOn[1] && stateGroup[1] > 0) || isShuttingDown[1];
      const orangeOpacity = faultGroup[1] ? 0.2 : (stateGroup[1] / 5);

      // 1. LUCES DE PISTA (ANARANJADO)
      const orangeLeds = document.querySelectorAll('.led-orange');
      orangeLeds.forEach(el => {
        el.style.opacity = isActivePista ? (orangeOpacity < 0.3 ? 0.3 : orangeOpacity) : 0.2;
        el.style.fill = isActivePista ? "#f97316" : "#a3a8ad";
        if (faultGroup[1]) el.classList.add('alarm-active'); else el.classList.remove('alarm-active');
      });

      // 2. LUCES FINAL DE PISTA (ENCIENDEN CON EL CIRCUITO DE PISTA)
      const th11_v = document.getElementById('th11-v');
      const th11_r = document.getElementById('th11-r');
      const th28_r = document.getElementById('th28-r');
      const th28_v = document.getElementById('th28-v');

      if (isActivePista) {
        const op = orangeOpacity < 0.3 ? 0.3 : orangeOpacity;
        th11_v.style.fill = "#22c55e"; th11_v.style.opacity = op;
        th11_r.style.fill = "#ef4444"; th11_r.style.opacity = op;
        th28_r.style.fill = "#ef4444"; th28_r.style.opacity = op;
        th28_v.style.fill = "#22c55e"; th28_v.style.opacity = op;
      } else {
        th11_v.style.fill = th11_r.style.fill = th28_r.style.fill = th28_v.style.fill = "#a3a8ad";
        th11_v.style.opacity = th11_r.style.opacity = th28_r.style.opacity = th28_v.style.opacity = 0.2;
      }

      // 3. LUCES DE TAXEO / RODAJE (AZUL)
      const isActiveTaxeo = (masterOn[2] && stateGroup[2] > 0) || isShuttingDown[2];
      const blueOpacity = faultGroup[2] ? 0.2 : (stateGroup[2] / 5);
      const blueLeds = document.querySelectorAll('.led-blue');
      blueLeds.forEach(el => {
        el.style.opacity = isActiveTaxeo ? (blueOpacity < 0.3 ? 0.3 : blueOpacity) : 0.2;
        el.style.fill = isActiveTaxeo ? "#3b82f6" : "#a3a8ad";
        if (faultGroup[2]) el.classList.add('alarm-active'); else el.classList.remove('alarm-active');
      });

      // 4. LUCES PAPI (AMARILLO)
      const isActivePapi = (masterOn[3] && stateGroup[3] > 0) || isShuttingDown[3];
      const papiOpacity = faultGroup[3] ? 0.2 : (stateGroup[3] / 5);
      const papiLeds = document.querySelectorAll('.led-papi');
      papiLeds.forEach(el => {
        el.style.opacity = isActivePapi ? (papiOpacity < 0.3 ? 0.3 : papiOpacity) : 0.2;
        el.style.fill = isActivePapi ? "#f59e0b" : "#a3a8ad";
        if (isActivePapi) el.style.filter = "drop-shadow(0 0 6px #f59e0b)"; else el.style.filter = "none";
        if (faultGroup[3]) el.classList.add('alarm-active'); else el.classList.remove('alarm-active');
      });

      // 5. FARO (PARPADEO BLANCO / VERDE)
      const beaconLed = document.getElementById('led-beacon');
      if (beaconLed) {
        if (beaconActive) {
          beaconLed.classList.add('beacon-active');
        } else {
          beaconLed.classList.remove('beacon-active');
          beaconLed.style.fill = "#a3a8ad";
          beaconLed.style.opacity = 0.3;
          beaconLed.style.filter = "none";
        }
      }
    }
  </script>
