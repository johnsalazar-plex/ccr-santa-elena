<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCR - Aeropuerto Santa Elena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121824; color: #fff; padding: 20px; text-align: center; }
    h1 { color: #38ef7d; margin-bottom: 5px; }
    h3 { color: #8892b0; margin-bottom: 20px; }
    .status-bar { background: #1f293d; padding: 10px; border-radius: 8px; display: inline-block; margin-bottom: 20px; }
    .status-dot { height: 12px; width: 12px; background-color: #ff4d4d; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .status-dot.connected { background-color: #00f2fe; }
    
    .panel { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; width: 220px; text-align: center; }
    .card h4 { margin-bottom: 15px; color: #f8fafc; }
    
    .btn { background: #334155; border: none; color: white; padding: 10px 15px; margin: 4px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    .btn:hover { background: #475569; }
    .btn.active { background: #10b981; color: #000; }
    .btn.off { background: #ef4444; }
  </style>
</head>
<body>

  <h1>AEROPUERTO SANTA ELENA</h1>
  <h3>PANEL MÍMICO Y CONTROL DE REGULADORES (CCR / AGL)</h3>

  <div class="status-bar">
    <span id="dot" class="status-dot"></span>
    <span id="status-text">Desconectado</span>
  </div>

  <div class="panel">
    <!-- GRUPO 1: PISTA -->
    <div class="card">
      <h4>Pista (RUNWAY)</h4>
      <button class="btn off" onclick="sendControl(1, 0)">OFF</button>
      <button class="btn" id="g1-b1" onclick="sendControl(1, 1)">B1</button>
      <button class="btn" id="g1-b2" onclick="sendControl(1, 2)">B2</button>
      <button class="btn" id="g1-b3" onclick="sendControl(1, 3)">B3</button>
    </div>

    <!-- GRUPO 2: TAXEO -->
    <div class="card">
      <h4>Taxeo (TAXIWAY)</h4>
      <button class="btn off" onclick="sendControl(2, 0)">OFF</button>
      <button class="btn" id="g2-b1" onclick="sendControl(2, 1)">B1</button>
      <button class="btn" id="g2-b2" onclick="sendControl(2, 2)">B2</button>
      <button class="btn" id="g2-b3" onclick="sendControl(2, 3)">B3</button>
    </div>

    <!-- GRUPO 3: PAPI -->
    <div class="card">
      <h4>PAPI</h4>
      <button class="btn off" onclick="sendControl(3, 0)">OFF</button>
      <button class="btn" id="g3-b1" onclick="sendControl(3, 1)">B1</button>
      <button class="btn" id="g3-b2" onclick="sendControl(3, 2)">B2</button>
      <button class="btn" id="g3-b3" onclick="sendControl(3, 3)">B3</button>
    </div>

    <!-- GRUPO 4: FARO -->
    <div class="card">
      <h4>Faro (BEACON)</h4>
      <button class="btn off" onclick="sendControl(4, 0)">OFF</button>
      <button class="btn" id="g4-b1" onclick="sendControl(4, 1)">ON</button>
    </div>
  </div>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;
    let ws;

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('dot').classList.add('connected');
        document.getElementById('status-text').innerText = 'Conectado en Vivo';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'SYNC_FULL_STATE') {
            updateAllUI(msg.data);
          } else if (msg.type === 'CONTROL_AGL') {
            if (msg.aglState) updateAllUI(msg.aglState);
            else updateSingleUI(msg.group, msg.state);
          }
        } catch (e) { console.error(e); }
      };

      ws.onclose = () => {
        document.getElementById('dot').classList.remove('connected');
        document.getElementById('status-text').innerText = 'Reconectando...';
        setTimeout(connect, 2000);
      };
    }

    function sendControl(group, state) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'CONTROL_AGL', group: group, state: state }));
      }
    }

    function updateAllUI(state) {
      for (let g = 1; g <= 3; g++) {
        updateSingleUI(g, state[g].state);
      }
      updateSingleUI(4, state[4].beacon ? 1 : 0);
    }

    function updateSingleUI(group, state) {
      if (group <= 3) {
        for (let b = 1; b <= 3; b++) {
          const btn = document.getElementById(`g${group}-b${b}`);
          if (btn) {
            if (b === state) btn.classList.add('active');
            else btn.classList.remove('active');
          }
        }
      } else if (group === 4) {
        const btn = document.getElementById('g4-b1');
        if (btn) {
          if (state === 1) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      }
    }

    connect();
  </script>
</body>
</html>
