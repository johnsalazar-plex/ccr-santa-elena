```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCR - Aeropuerto Santa Elena</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .header { background-color: #1e293b; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid #334155; }
    .user-badge { background-color: #0284c7; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
    .status-badge { padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; background-color: #dc2626; }
    .status-online { background-color: #16a34a; }
    .title-box { text-align: center; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background-color: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; text-align: center; }
    .card h3 { color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.2s; background-color: #334155; color: white; }
    .btn:hover { background-color: #475569; }
    .btn-active { background-color: #0284c7; color: white; box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }
    .btn-off { background-color: #ef4444; }
    .btn-off:hover { background-color: #dc2626; }
    .slider-container { margin: 15px 0; }
    .slider { width: 100%; height: 8px; border-radius: 5px; background: #334155; outline: none; }
    .val-display { font-size: 1.2rem; font-weight: bold; color: #f59e0b; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-badge">GERENTE GENERAL</div>
    <h2>PANEL DE CONTROL CCR / AGL</h2>
    <div id="netStatus" class="status-badge">DESCONECTADO</div>
  </div>

  <div class="grid">
    <!-- PISTA -->
    <div class="card">
      <h3>LUCES DE PISTA</h3>
      <div class="slider-container">
        <label>Nivel de Brillo (0-5)</label>
        <input type="range" id="slider-1" class="slider" min="0" max="5" value="0" onchange="sendControl(1, parseInt(this.value))">
        <div id="val-1" class="val-display">APAGADO</div>
      </div>
      <div class="controls">
        <button class="btn btn-off" onclick="sendControl(1, 0)">APAGAR</button>
      </div>
    </div>

    <!-- TAXEO -->
    <div class="card">
      <h3>LUCES DE TAXEO</h3>
      <div class="slider-container">
        <label>Nivel de Brillo (0-5)</label>
        <input type="range" id="slider-2" class="slider" min="0" max="5" value="0" onchange="sendControl(2, parseInt(this.value))">
        <div id="val-2" class="val-display">APAGADO</div>
      </div>
      <div class="controls">
        <button class="btn btn-off" onclick="sendControl(2, 0)">APAGAR</button>
      </div>
    </div>

    <!-- PAPI -->
    <div class="card">
      <h3>SISTEMA PAPI</h3>
      <div class="slider-container">
        <label>Nivel de Brillo (0-5)</label>
        <input type="range" id="slider-3" class="slider" min="0" max="5" value="0" onchange="sendControl(3, parseInt(this.value))">
        <div id="val-3" class="val-display">APAGADO</div>
      </div>
      <div class="controls">
        <button class="btn btn-off" onclick="sendControl(3, 0)">APAGAR</button>
      </div>
    </div>

    <!-- FARO -->
    <div class="card">
      <h3>FARO AEROPORTUARIO</h3>
      <div class="controls" style="margin-top: 30px;">
        <button id="btn-faro-on" class="btn" onclick="sendControl(4, 1)">ENCENDER FARO</button>
        <button id="btn-faro-off" class="btn btn-off" onclick="sendControl(4, 0)">APAGAR FARO</button>
      </div>
      <div id="val-4" class="val-display" style="margin-top: 20px;">APAGADO</div>
    </div>
  </div>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;
    let socket;

    function connect() {
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        const netStatus = document.getElementById('netStatus');
        netStatus.textContent = 'EN LÍNEA';
        netStatus.classList.add('status-online');
      };

      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'SYNC_FULL_STATE') {
            syncFullUI(msg.data);
          } else if (msg.type === 'CONTROL_AGL') {
            updateSingleUI(msg.group, msg.state);
          }
        } catch (e) {
          console.error("Error al procesar mensaje:", e);
        }
      };

      socket.onclose = () => {
        const netStatus = document.getElementById('netStatus');
        netStatus.textContent = 'DESCONECTADO';
        netStatus.classList.remove('status-online');
        setTimeout(connect, 3000);
      };
    }

    function sendControl(group, state) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'CONTROL_AGL',
          group: group,
          state: state
        }));
      }
    }

    function syncFullUI(data) {
      for (let g = 1; g <= 3; g++) {
        updateSingleUI(g, data[g].state);
      }
      updateSingleUI(4, data[4].beacon ? 1 : 0);
    }

    function updateSingleUI(group, state) {
      if (group >= 1 && group <= 3) {
        const slider = document.getElementById(`slider-${group}`);
        const valDisplay = document.getElementById(`val-${group}`);
        if (slider) slider.value = state;
        if (valDisplay) valDisplay.textContent = state === 0 ? 'APAGADO' : `NIVEL ${state}`;
      } else if (group === 4) {
        const valDisplay = document.getElementById('val-4');
        const btnOn = document.getElementById('btn-faro-on');
        if (valDisplay) valDisplay.textContent = state === 1 ? 'ENCENDIDO' : 'APAGADO';
        if (btnOn) {
          if (state === 1) btnOn.classList.add('btn-active');
          else btnOn.classList.remove('btn-active');
        }
      }
    }

    connect();
  </script>
</body>
</html>
